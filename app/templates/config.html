<!DOCTYPE html>
<html><head><meta charset=UTF-8><title>Configuracoes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f7fa;height:100vh;overflow:hidden}
.header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 32px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;color:#1a3a5c;font-size:16px}
.user-area{display:flex;align-items:center;gap:18px;font-size:13px;color:#4b5563}
.user-area a{color:#4b5563;text-decoration:none}
.user-avatar{width:32px;height:32px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.btn-logout{border:1px solid #d1d5db;background:#fff;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer}
.container{display:flex;gap:20px;padding:20px;height:calc(100vh - 65px)}
.card{background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.08);padding:24px;flex:0 0 400px;height:100%;overflow-y:auto}
.preview{background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.08);padding:20px;flex:1;display:flex;flex-direction:column;height:100%}
.preview h3{font-size:16px;color:#111827;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#pdfviewer{flex:1;border:1px solid #e5e7eb;border-radius:8px;overflow-y:auto;background:#525659;cursor:crosshair}
h2{font-size:22px;color:#111827;margin-bottom:4px}
.sub{font-size:13px;color:#6b7280;margin-bottom:20px}
.sec-title{font-size:12px;font-weight:700;color:#1a3a5c;letter-spacing:1px;margin-top:24px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #e5e7eb}
label{display:block;font-size:11px;font-weight:600;color:#374151;letter-spacing:0.5px;margin-bottom:6px;margin-top:14px}
textarea{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;font-family:Arial;outline:none;resize:vertical}
.img-item{display:flex;gap:12px;align-items:center;padding:12px;background:#fafbfc;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px}
.img-thumb{width:80px;height:80px;border-radius:8px;object-fit:cover;border:1px solid #e5e7eb;background:#fff;flex-shrink:0}
.img-info{flex:1;min-width:0}
.img-info .title{font-size:12px;font-weight:700;color:#1a3a5c;margin-bottom:4px}
.img-info input[type=file]{width:100%;font-size:11px;padding:6px;border:1px dashed #d1d5db;border-radius:6px;background:#fff}
.btn-salvar{width:100%;background:#1f4e3d;color:#fff;border:none;padding:14px;border-radius:8px;font-size:14px;font-weight:600;margin-top:20px;cursor:pointer}
.btn-voltar{display:inline-block;margin-top:12px;color:#4b5563;text-decoration:none;font-size:13px}
</style></head><body>
<div class=header><div class=logo>PROPOSTA SOLAR</div>
<div class=user-area><div class=user-avatar>C</div><span>CELSO</span><a href=/>Voltar ao inicio</a><button class=btn-logout>Logout</button></div></div>
<div class=container>
<div class=card>
<h2>Configuracoes</h2><p class=sub>Clique no PDF para escolher a posicao</p>
<form method=post action=/upload enctype=multipart/form-data>
<div class=sec-title>TEXTO</div>
<label>TEXTO QUEM SOMOS</label>
<textarea name=quem_somos rows=5>{{quem_somos}}</textarea>
<div class=sec-title>IMAGENS FIXAS</div>
<div class=img-item><img class=img-thumb src=/static/img/casa.jpg><div class=img-info><div class=title>LOGO</div><input type=file name=logo accept=image/*></div></div>
<div class=img-item><img class=img-thumb src=/static/img/casa.jpg><div class=img-info><div class=title>IMAGEM DA CASA</div><input type=file name=casa accept=image/*></div></div>
<div class=img-item><img class=img-thumb src=/static/img/painel.jpg><div class=img-info><div class=title>PAINEL SOLAR</div><input type=file name=painel accept=image/*></div></div>
<div class=img-item><img class=img-thumb src=/static/img/inversor.jpg><div class=img-info><div class=title>INVERSOR</div><input type=file name=inversor accept=image/*></div></div>
<div style="margin-top:10px"><button type=button onclick=salvarPosicoes() style="width:100%;background:#2d6a9f;color:#fff;border:none;padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">Salvar Posicao</button></div>
<div class=sec-title>NOVA IMAGEM PERSONALIZADA</div>
<div style="padding:12px;background:#f0f9ff;border:1px solid #93c5fd;border-radius:8px;font-size:12px;color:#1e40af">
<div id=coords style="margin-bottom:8px;font-weight:700">1. Clique no PDF ao lado</div>
<label style="font-size:11px;font-weight:600;color:#374151">2. ESCOLHA O ARQUIVO</label>
<input type=file name=extra_img accept=image/* style="width:100%;margin-top:6px;padding:8px;border:1px dashed #d1d5db;border-radius:6px;background:#fff">
<input type=hidden name=img_x id=img_x>
<input type=hidden name=img_y id=img_y>
</div>
<div class=sec-title>IMAGENS ADICIONADAS</div>
<div id=lista_extras></div>
<button class=btn-salvar type=submit>Salvar e Atualizar</button>
</form>
<a href=/ class=btn-voltar>&larr; Voltar</a>
</div>
<div class=preview>
<h3>Preview do PDF <button onclick=recarregar() style="background:#f5f7fa;border:1px solid #d1d5db;color:#374151;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer">&#8635; Atualizar</button></h3>
<div id=pdfviewer></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
document.addEventListener("click", function(ev){
  if(ev.target.tagName === "CANVAS"){
    var rect = ev.target.getBoundingClientRect();
    var x = Math.round(ev.clientX - rect.left);
    var y = Math.round(ev.clientY - rect.top);
    document.getElementById("img_x").value = x;
    document.getElementById("img_y").value = y;
    document.getElementById("coords").innerHTML = "1. Posicao: X=" + x + " Y=" + y;
  }
});
function recarregar(){
  const container = document.getElementById("pdfviewer");
  container.innerHTML = "";
  pdfjsLib.getDocument("/preview?t=" + Date.now()).promise.then(function(pdf){
    for(let i=1;i<=pdf.numPages;i++){
      pdf.getPage(i).then(function(page){
        const viewport = page.getViewport({scale:1.4});
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.display = "block";
        canvas.style.margin = "10px auto";
        canvas.style.boxShadow = "0 2px 8px rgba(0,0,0,0.3)";
        container.appendChild(canvas);
        page.render({canvasContext: canvas.getContext("2d"), viewport: viewport});
      });
    }
  });
}
recarregar();
</script>

<script>
var EXTRAS = {{ extras_json|safe }};
var posicoes = JSON.parse(JSON.stringify(EXTRAS));
function renderExtras(){
  var box = document.getElementById("lista_extras");
  box.innerHTML = "";
  posicoes.forEach(function(ex, i){
    var div = document.createElement("div");
    div.style.cssText = "padding:10px;background:#fafbfc;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px";
    div.innerHTML = '<div style="display:flex;gap:10px;align-items:center"><img src="/static/uploads/extra_' + i + '.png" style="width:60px;height:60px;object-fit:cover;border-radius:6px"><div style="flex:1;font-size:12px"><b>Imagem ' + (i+1) + '</b><br><span id="pos_' + i + '">X: ' + ex.x + ' | Y: ' + ex.y + '</span></div><button onclick="excluir(' + i + ')" style="background:#dc2626;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer">Excluir</button></div>' +
      '<div style="margin-top:8px;font-size:11px;color:#6b7280">Mova com as setas:</div>' +
      '<div style="display:flex;gap:4px;margin-top:4px">' +
      '<button onclick="mover(' + i + ',0,-10)" style="flex:1;padding:6px;border:1px solid #d1d5db;background:#fff;border-radius:4px;cursor:pointer">&#8593;</button>' +
      '<button onclick="mover(' + i + ',0,10)" style="flex:1;padding:6px;border:1px solid #d1d5db;background:#fff;border-radius:4px;cursor:pointer">&#8595;</button>' +
      '<button onclick="mover(' + i + ',-10,0)" style="flex:1;padding:6px;border:1px solid #d1d5db;background:#fff;border-radius:4px;cursor:pointer">&#8592;</button>' +
      '<button onclick="mover(' + i + ',10,0)" style="flex:1;padding:6px;border:1px solid #d1d5db;background:#fff;border-radius:4px;cursor:pointer">&#8594;</button>' +
      '</div>';
    box.appendChild(div);
  });
}
function mover(i, dx, dy){
  posicoes[i].x += dx;
  posicoes[i].y += dy;
  document.getElementById("pos_" + i).innerText = "X: " + posicoes[i].x + " | Y: " + posicoes[i].y;
  aplicarSobreposicao();
}
function aplicarSobreposicao(){
  var container = document.getElementById("pdfviewer");
  var overlay = document.getElementById("overlay");
  if(!overlay){
    overlay = document.createElement("div");
    overlay.id = "overlay";
    overlay.style.cssText = "position:absolute;pointer-events:none;z-index:10";
    container.style.position = "relative";
    container.appendChild(overlay);
  }
  overlay.innerHTML = "";
  posicoes.forEach(function(ex, i){
    var img = document.createElement("img");
    img.src = "/static/uploads/extra_" + i + ".png";
    img.style.cssText = "position:absolute;left:" + ex.x + "px;top:" + ex.y + "px;width:180px";
    overlay.appendChild(img);
  });
}
function salvarPosicoes(){
  posicoes.forEach(function(ex, i){
    fetch("/mover_extra", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:"indice=" + i + "&x=" + ex.x + "&y=" + ex.y});
  });
}
function excluir(i){
  if(!confirm("Excluir imagem " + (i+1) + "?")) return;
  var fd = new FormData();
  fd.append("indice", i);
  fetch("/excluir_extra", {method:"POST", body:fd, redirect:"follow"}).then(function(){
    window.location.href = "/config?t=" + Date.now();
  });
}
renderExtras();
</script>
</body></html>
