name: Build Windows
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-pango
      - run: pip install -r requirements.txt uvicorn python-multipart pyinstaller
      - run: pyinstaller --noconfirm --onedir --name PropostaSolar --collect-all weasyprint --collect-submodules uvicorn --hidden-import python_multipart --hidden-import multipart --add-data "app;app" launcher.py
      - shell: bash
        run: |
          mkdir -p dist/PropostaSolar/_internal/gtk
          cp -r "$(cygpath -u '${{ steps.msys.outputs.msys2-location }}')/mingw64/bin/." dist/PropostaSolar/_internal/gtk/
      - uses: actions/upload-artifact@v4
        with:
          name: PropostaSolar
          path: dist/PropostaSolar
      - shell: pwsh
        run: iscc installer/setup.iss
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PropostaSolar build ${{ github.run_number }}
          files: PropostaSolar_Setup.exe
